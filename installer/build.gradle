plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nexos.installer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexos.installer'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Sin dependencias externas en la app: PackageInstaller es del framework.
// Solo JUnit para el test unitario puro (ApkUtilsTest).
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
