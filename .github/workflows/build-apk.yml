name: Build APK (debug)

# Template universal: cada job solo corre si detecta su tipo de proyecto.
# - Nativo (Kotlin/Java + Gradle): requiere settings.gradle
# - Flutter: requiere pubspec.yaml
# - Buildozer/Kivy: requiere buildozer.spec

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    name: Android nativo (Gradle)
    if: hashFiles('settings.gradle') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Permiso de ejecucion a gradlew
        run: chmod +x gradlew

      - name: Compilar APK debug
        run: ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  build-flutter:
    name: Flutter
    if: hashFiles('pubspec.yaml') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Obtener dependencias
        run: flutter pub get

      - name: Compilar APK debug
        run: flutter build apk --debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-flutter
          path: build/app/outputs/flutter-apk/app-debug.apk

  build-buildozer:
    name: Buildozer (Kivy/Python)
    if: hashFiles('buildozer.spec') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config cmake libffi-dev libssl-dev zlib1g-dev

      - name: Instalar Buildozer
        run: pip install buildozer cython

      - name: Compilar APK debug
        run: buildozer android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-buildozer
          path: bin/*.apk
